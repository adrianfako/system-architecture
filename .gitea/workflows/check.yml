# Gitea checks replace the inherited GitHub workflows on this mirror.
# Publishing remains exclusively in the unchanged .github/workflows/ files.
name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pages show their last author and date
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate page front matter
        run: npm run check
      - name: Build the site (fails on broken links)
        run: npm run build

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check licensing (REUSE)
        uses: fsfe/reuse-action@v5
